networks:
  default:
    name: shared_network
    external: true

services:

  lims_php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lims-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - PHP_OPCACHE_ENABLE=1
    extra_hosts:
      - "db-host:192.168.1.136"   # MySQL shared infra

  lims_nginx:
    image: nginx:1.25-alpine
    container_name: lims-nginx
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    environment:
      - PHP_HOST=lims_php
    depends_on:
      - lims_php
